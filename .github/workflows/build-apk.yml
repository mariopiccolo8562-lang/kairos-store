name: Compila Kairos Store (APK)

on:
  push:
    branches: [main]
    paths: ['android/**', 'docs/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepara la chiave di firma (se configurata)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kairos.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/kairos.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret KEYSTORE_BASE64 assente: compilo una versione di prova (debug). Gli aggiornamenti futuri potrebbero non installarsi sopra questa."
          fi

      - name: Compila
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_URL: ${{ vars.STORE_URL }}
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then TASK=assembleRelease; DIR=release; else TASK=assembleDebug; DIR=debug; fi
          EXTRA=""; if [ -n "$STORE_URL" ]; then EXTRA="-PstoreUrl=$STORE_URL"; fi
          gradle --no-daemon $TASK $EXTRA
          cp app/build/outputs/apk/$DIR/*.apk ../KairosStore.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KairosStore-apk
          path: KairosStore.apk

      - name: Pubblica come Release (link fisso per Downloader)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kairos Store 1.0.${{ github.run_number }}
          files: KairosStore.apk
          make_latest: true
