# SOLO PROVA DI COMPILAZIONE dell'APK sul ramo «app-consigliata-dati» (con le prove JVM di StoreLinksTest e SpecParseTest).
# Niente chiave di firma, niente artefatti, niente release: ai clienti non arriva nulla.
# (La versione vera la compila e pubblica «Compila Kairos Store (APK)» quando il ramo viene unito a main.)
name: Prova APK (ramo app-consigliata-dati, non pubblica)

on:
  push:
    branches: [app-consigliata-dati]
    paths: ['android/**', 'docs/**', '.github/workflows/prova-apk.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prove JVM e compilazione (debug, solo controllo)
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Controlla che l'APK ci sia (e non lo pubblica)
        run: ls -l android/app/build/outputs/apk/debug/*.apk
